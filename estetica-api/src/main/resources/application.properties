spring.application.name=estetica-api
server.port=8080

# ===================================================================
# BANCO DE DADOS POSTGRESQL PRODUÇÃO (Coolify 93.127.212.65:3008)
# Localhost conectado diretamente no banco de produção
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://93.127.212.65:3008/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vra7v6XMf3798kBc2AADCLIYqUmag5OfHgdfB6j10ENx9rP5vC0bFsMufGdLIY1n}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JWT & Segurança
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# Configurações de Fuso Horário e JSON
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Uploads de Arquivos e Fotos
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

